name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-ci:
    name: Backend Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Verify Python Syntax
        run: |
          python -m compileall app

      - name: Verify Uvicorn
        run: |
          uvicorn --version

      - name: Run Tests
        env:
          DEBUG: "true"
          DATABASE_URL: "sqlite:///./ci-test.db"
          SECRET_KEY: "ci-only-secret-key-not-used-anywhere-else-0123456789"
          PAYMENT_REMINDER_SCHEDULER: "false"
          CELERY_WORKERS_ENABLED: "false"
        run: |
          python -m pytest -q -p no:warnings
