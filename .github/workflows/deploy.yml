name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  # Nothing reaches the server unless every backend test passes.
  test:
    name: Tests before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run Tests
        env:
          DEBUG: "true"
          DATABASE_URL: "sqlite:///./ci-test.db"
          SECRET_KEY: "ci-only-secret-key-not-used-anywhere-else-0123456789"
          PAYMENT_REMINDER_SCHEDULER: "false"
          CELERY_WORKERS_ENABLED: "false"
        run: |
          python -m pytest -q -p no:warnings

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /root/charity-connect-backend

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            /root/charity-connect-backend/venv/bin/pip install -r requirements.txt

            echo "Restarting backend..."
            systemctl restart charity.service

            # The Celery worker sends push notifications; restart it so it runs the new code too.
            if systemctl list-unit-files charity-celery.service --no-legend | grep -q charity-celery; then
              echo "Restarting notification worker..."
              systemctl restart charity-celery.service
              systemctl is-active charity-celery.service
            fi

            echo "Checking service status..."
            systemctl --no-pager --full status charity.service

            echo "Deployment completed successfully!"