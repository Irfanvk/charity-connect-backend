name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /root/charity-connect-backend

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            /root/charity-connect-backend/venv/bin/pip install -r requirements.txt

            echo "Restarting backend..."
            systemctl restart charity.service

            # The Celery worker sends push notifications; restart it so it runs the new code too.
            if systemctl list-unit-files charity-celery.service --no-legend | grep -q charity-celery; then
              echo "Restarting notification worker..."
              systemctl restart charity-celery.service
              systemctl is-active charity-celery.service
            fi

            echo "Checking service status..."
            systemctl --no-pager --full status charity.service

            echo "Deployment completed successfully!"